<article fdCard sky="tokiwa" emblem="usagi">
  <fd-badge slot="badge" tone="tokiwa">{{ i18n.messages().hintBadge }}</fd-badge>
  <span slot="title">{{ i18n.messages().mnemonicTitle }}</span>
  <span slot="meta">{{ name() }}</span>
  {{ mnemonic() }}
  <a
    slot="actions"
    fdLink
    class="app-suggest-tip"
    target="_blank"
    rel="noopener noreferrer"
    [href]="suggestUrl()"
    >{{ i18n.messages().suggestTip }}</a
  >
</article>
