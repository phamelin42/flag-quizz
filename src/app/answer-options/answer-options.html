<div class="app-options" role="group" aria-label="Choisis le pays de ce drapeau">
  @for (option of quiz.question().options; track option.code) {
    @let state = states()[option.code];
    <button
      #option
      fdButton
      block
      class="app-option"
      [variant]="state === 'correct' ? 'primary' : state === 'wrong' ? 'danger' : 'secondary'"
      [attr.aria-disabled]="state === 'dimmed' ? 'true' : null"
      (click)="choose(option.code)"
    >
      @if (state === 'correct') {
        <svg fdIcon="check"></svg>
      } @else if (state === 'wrong') {
        <svg fdIcon="close"></svg>
      }
      {{ name(option.code) }}
      @if (state === 'correct') {
        <span class="fd-sr">, bonne réponse</span>
      } @else if (state === 'wrong') {
        <span class="fd-sr">, ta réponse, incorrecte</span>
      }
    </button>
  }
</div>

<div class="app-verdict" aria-live="polite">
  @if (quiz.isAnswered()) {
    <fd-alert
      [tone]="quiz.isCorrect() ? 'success' : 'warning'"
      [title]="quiz.isCorrect() ? 'Bravo !' : 'Raté !'"
    >
      {{ quiz.isCorrect() ? 'Bonne réponse' : 'La bonne réponse était' }} :
      {{ name(quiz.question().country.code) }}.
    </fd-alert>
  }
</div>

@if (quiz.isAnswered()) {
  <button #nextBtn fdButton variant="primary" size="lg" block (click)="next()">
    Drapeau suivant
    <svg fdIcon="chevron-right"></svg>
  </button>
}
