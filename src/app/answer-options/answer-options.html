<div class="app-options" role="group" [attr.aria-label]="i18n.messages().chooseCountry">
  @for (option of quiz.question().options; track option.code) {
    @let state = states()[option.code];
    <button
      #option
      fdButton
      block
      class="app-option"
      [variant]="state === 'correct' ? 'success' : state === 'wrong' ? 'danger' : 'secondary'"
      [attr.aria-disabled]="state === 'dimmed' ? 'true' : null"
      (click)="choose(option.code)"
    >
      @if (state === 'correct') {
        <svg fdIcon="check"></svg>
      } @else if (state === 'wrong') {
        <svg fdIcon="close"></svg>
      }
      {{ i18n.countryName(option.code) }}
      @if (state === 'correct') {
        <span class="fd-sr">{{ i18n.messages().correctAnswerSr }}</span>
      } @else if (state === 'wrong') {
        <span class="fd-sr">{{ i18n.messages().wrongAnswerSr }}</span>
      }
    </button>
  }
</div>

<!-- Le verdict n'a pas d'encart : la couleur et l'icône des boutons le montrent, ce texte l'annonce. -->
<p class="fd-sr app-status" aria-live="polite">
  @if (quiz.isAnswered()) {
    {{ i18n.messages().verdict(quiz.isCorrect(), i18n.countryName(quiz.question().country.code)) }}
  }
</p>

@if (quiz.isAnswered()) {
  <button #nextBtn fdButton class="app-next" size="lg" block (click)="next()">
    {{ i18n.messages().nextFlag }}
    <svg fdIcon="chevron-right"></svg>
  </button>
}
