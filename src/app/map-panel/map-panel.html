<div fdCard>
  <span slot="title">{{ i18n.messages().mapTitle }}</span>
  <span slot="meta">{{ name() }}</span>
  <!-- Changer l'adresse d'une iframe déjà chargée ajoute une entrée à l'historique (le bouton « Retour »
       annulerait la carte avant la langue) : on en recrée une, dont le premier chargement n'en ajoute pas. -->
  @for (url of [src()]; track url) {
    <iframe
      class="app-map"
      [src]="url"
      [title]="i18n.messages().mapFrameTitle(name())"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  }
</div>
