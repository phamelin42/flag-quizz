<header class="app-header">
  <h1 class="app-title">Flag Quizz</h1>
  <ul class="app-stats" [attr.aria-label]="i18n.messages().scoreLabel">
    <li>
      <fd-badge tone="sakura" soft>{{
        i18n.messages().score(quiz.score(), quiz.asked())
      }}</fd-badge>
    </li>
    <li>
      <fd-badge tone="yamabuki" soft>{{ i18n.messages().streak(quiz.streak()) }}</fd-badge>
    </li>
    <li>
      <fd-badge>{{ i18n.messages().record(quiz.bestStreak()) }}</fd-badge>
    </li>
  </ul>
  <div class="app-settings">
    <fd-switch [checked]="isDark()" (checkedChange)="setDark($event)">{{
      i18n.messages().darkTheme
    }}</fd-switch>
    <a
      fdLink
      class="app-language"
      [href]="i18n.otherLocaleHref()"
      [attr.lang]="i18n.otherLocale()"
      [attr.hreflang]="i18n.otherLocale()"
      (click)="switchLanguage($event)"
      >{{ i18n.messages().otherLanguageName }}</a
    >
  </div>
</header>

<main class="app-main">
  <section class="app-play">
    <app-flag-card [country]="quiz.question().country" [revealed]="quiz.isAnswered()" />
    <app-answer-options />
  </section>

  <!-- Rien ne s'affiche avant la réponse : l'anecdote et la carte donneraient la solution. -->
  @if (quiz.isAnswered()) {
    <div class="app-bottom">
      <app-fun-fact [country]="quiz.question().country" />
      <app-map-panel [country]="quiz.question().country" />
    </div>
  }
</main>
