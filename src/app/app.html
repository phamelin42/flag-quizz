<header class="app-header">
  <h1 class="app-title">Flag Quizz</h1>
  <ul class="app-stats" aria-label="Ton score">
    <li>
      <fd-badge tone="sakura" soft>Score {{ quiz.score() }} / {{ quiz.asked() }}</fd-badge>
    </li>
    <li>
      <fd-badge tone="yamabuki" soft>Série {{ quiz.streak() }}</fd-badge>
    </li>
    <li>
      <fd-badge>Record {{ quiz.bestStreak() }}</fd-badge>
    </li>
  </ul>
  <div class="app-tools">
    <nav aria-label="Autres quiz">
      <a fdLink href="https://capitals-quizz.phamelin.fr">Quiz des capitales</a>
    </nav>
    <fd-switch [checked]="isDark()" (checkedChange)="setDark($event)">Thème nuit</fd-switch>
  </div>
</header>

<main class="app-main">
  <section class="app-play">
    <app-flag-card [country]="quiz.question().country" [revealed]="quiz.isAnswered()" />
    <app-answer-options />
  </section>

  <!-- Rien ne s'affiche avant la réponse : l'astuce, l'anecdote et la carte donneraient la solution. -->
  @if (quiz.isAnswered()) {
    <div class="app-bottom">
      <div class="app-hints">
        <app-mnemonic-panel [country]="quiz.question().country" />
        <app-fun-fact [country]="quiz.question().country" />
      </div>
      <app-map-panel [country]="quiz.question().country" />
    </div>
  }
</main>

<footer class="app-footer">
  <p>
    Vous voulez en voir plus ? Visitez mon
    <a fdLink href="https://phamelin.fr/#projects">portfolio</a>
  </p>
</footer>
